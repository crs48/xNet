    <!--
      `connect-src` here is NOT an allowlist, despite appearances: the bare
      `https://*` and `wss://*` subsume every host named after them. Both are
      load-bearing — a user-configured custom hub receives crash-report ingest
      over https (0341) and carries its sync socket over wss, and the AI
      cloud-key tier accepts a self-hosted OpenAI-compatible base URL. Those
      origins are typed by the user at runtime, so no static policy can name
      them; dropping the wildcard would remove custom-hub support from the web
      build (investigated in 0394 — the Electron shell has no wildcard and so
      already cannot reach custom hubs).

      The named hosts below are kept as the documented intent, and as the
      basis for any future tightening. Egress from injected AI content is
      contained by the plan-first tool contract and `guardedFetch`, not here.
    -->
