<!doctype html>
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' blob:; worker-src blob:; connect-src 'none'; img-src 'none'; style-src 'none'; base-uri 'none'; form-action 'none';"
/>
<script>
  window.addEventListener(
    'message',
    (event) => {
      if (event.source !== parent || event.data !== 'xnet-preview-connect' || !event.ports[0])
        return
      const port = event.ports[0]
      let started = false
      port.onmessage = ({ data }) => {
        if (started) return
        started = true
        const url = URL.createObjectURL(new Blob([data.runtimeSource], { type: 'text/javascript' }))
        const worker = new Worker(url)
        const stop = () => {
          worker.terminate()
          URL.revokeObjectURL(url)
        }
        worker.onmessage = (event) => {
          port.postMessage(event.data)
          stop()
        }
        worker.onerror = (event) => {
          port.postMessage({
            ok: false,
            error: event.message || 'The extension runtime failed to load.'
          })
          stop()
        }
        worker.postMessage({ code: data.code, dataset: data.dataset, channelId: data.channelId })
      }
      port.start()
      port.postMessage({ ready: true })
    },
    { once: true }
  )
</script>
