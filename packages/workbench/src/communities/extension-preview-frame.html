<!doctype html>
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' blob:; worker-src blob:; connect-src 'none'; img-src 'none'; style-src 'none'; base-uri 'none'; form-action 'none';"
/>
<script>
  window.addEventListener(
    'message',
    (event) => {
      if (event.source !== parent || event.data !== 'xnet-preview-connect' || !event.ports[0])
        return
      const port = event.ports[0]
      let worker, url
      const stop = () => {
        worker?.terminate()
        if (url) URL.revokeObjectURL(url)
        port.close()
      }
      port.onmessage = ({ data }) => {
        if (data.type === 'stop') {
          stop()
          return
        }
        if (!worker) {
          if (data.type !== 'start' || typeof data.runtimeSource !== 'string') return
          url = URL.createObjectURL(new Blob([data.runtimeSource], { type: 'text/javascript' }))
          worker = new Worker(url)
          worker.onmessage = (event) => port.postMessage(event.data)
          worker.onerror = () => {
            port.postMessage({ type: 'error', message: 'The extension runtime failed.' })
            stop()
          }
        }
        const { runtimeSource, ...message } = data
        worker.postMessage(message)
      }
      window.addEventListener('pagehide', stop, { once: true })
      port.start()
      port.postMessage({ ready: true })
    },
    { once: true }
  )
</script>
