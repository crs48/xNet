<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>xNet peer player</title>
    <link rel="stylesheet" href="player.css" />
    <script src="player.js" type="module"></script>
  </head>
  <body>
    <p id="status" role="status">Connecting to your desktop…</p>
    <button id="retry" type="button" hidden>Try again</button>
    <audio id="audio" controls hidden aria-label="Shared music"></audio>
    <video id="video" controls playsinline hidden></video
    ><img id="image" alt="Shared community image" hidden />
    <p class="small">
      Media comes through your local desktop, which stays in control of hosting and bandwidth.
    </p>
  </body>
</html>
