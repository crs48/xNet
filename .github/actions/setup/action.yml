name: Set up xNet
description: Pinned Node and pnpm with a frozen application lockfile
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10.30.3
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
