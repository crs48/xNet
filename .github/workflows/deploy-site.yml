name: Deploy Site to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
      - '.github/actions/publish-gh-pages/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm --dir site install --frozen-lockfile
      - name: Resolve changelog attribution
        run: node scripts/changelog/resolve-prs.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm --dir site build
      - name: Publish verified consumer site
        uses: ./.github/actions/publish-gh-pages
        with:
          source: site/dist
          target: .
          # Signed feeds and retained preview evidence have independent owners.
          exclude: |
            releases
            pr
            branch
            visuals-baseline
            visuals
          commit-message: 'deploy(site): publish the xNet consumer site'
