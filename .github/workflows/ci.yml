name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
          components: rustfmt
      - run: pnpm lint
      - run: node scripts/check-repository.mjs --selftest
      - run: pnpm build
      - run: pnpm test:js
      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -shellcheck=
  network:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p community-network -p community-node -p community-registry
  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            bundle: app
            binary: target/debug/community-desktop
          - os: windows-2022
            bundle: nsis
            binary: target/debug/community-desktop.exe
          - os: ubuntu-24.04
            bundle: deb
            binary: target/debug/community-desktop
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-${{ matrix.os }}
      - run: pnpm build
      - name: Build a development installer
        working-directory: apps/desktop
        run: pnpm exec tauri build --debug --bundles ${{ matrix.bundle }}
      - name: Test native private and group conversations
        if: runner.os != 'Linux'
        run: python scripts/check-desktop-chat.py ${{ matrix.binary }} --loopback
      - name: Test Linux native conversations
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/check-desktop-chat.py ${{ matrix.binary }} --loopback
      - uses: actions/upload-artifact@v4
        with:
          name: xnet-development-${{ matrix.os }}
          path: target/debug/bundle/
          if-no-files-found: error
          retention-days: 7
  desktop:
    if: always()
    needs: [native]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every native target
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
        run: test "$NATIVE_RESULT" = success
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm --dir site install --frozen-lockfile
      - run: pnpm --dir site build
      - uses: actions/upload-artifact@v4
        with:
          name: consumer-site
          path: site/dist
          if-no-files-found: error
          retention-days: 7
  hub:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: sh deploy/hub/stage.sh /tmp/xnet-hub
      - name: Build the exact deploy context
        run: docker build -t xnet-hub:test /tmp/xnet-hub
      - name: Verify modes, quotas, and no media hosting
        run: >-
          docker run --rm --entrypoint sh -v "$PWD/deploy/hub:/checks:ro" xnet-hub:test -c
          'apt-get update && apt-get install -y --no-install-recommends python3 && python3 /checks/check-modes.py /app'
