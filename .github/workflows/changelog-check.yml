name: Changelog Check
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
    branches: [main]
permissions:
  contents: read
jobs:
  changelog-section:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a product note or explicit exemption
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        run: |
          if [ "$SKIP" = true ]; then exit 0; fi
          git diff --name-only --diff-filter=AM "$BASE...$HEAD" > /tmp/xnet-changed
          if grep -Eq '^site/src/data/changelog/[^/]+\.json$' /tmp/xnet-changed; then exit 0; fi
          echo 'Add a changelog fragment or the skip-changelog label.'
          exit 1
