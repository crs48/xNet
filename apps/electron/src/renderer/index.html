<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      On-device AI needs four things the packaged renderer used to deny
      (exploration 0394): 'wasm-unsafe-eval' to compile the WebLLM / ONNX
      runtimes, `worker-src blob:` because both spawn blob workers,
      huggingface.co + raw.githubusercontent.com for model weights and the
      MLC model libraries, and the 127.0.0.1 loopback the connector ladder
      actually probes for the agent bridge (:31416) and Ollama.

      Unlike the web build this connect-src has no `https://*`, so it is a
      real allowlist: adding an outbound host means adding it here.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws://localhost:* http://localhost:* ws://127.0.0.1:* http://127.0.0.1:* https://hub.xnet.fyi https://*.xnet.fyi https://www.youtube.com https://publish.twitter.com https://huggingface.co https://*.huggingface.co https://*.hf.co https://raw.githubusercontent.com; font-src 'self' data:; worker-src 'self' blob:; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://open.spotify.com https://w.soundcloud.com https://platform.twitter.com https://www.instagram.com https://instagram.com https://www.tiktok.com https://codepen.io https://codesandbox.io https://stackblitz.com https://figma.com https://www.figma.com"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xNet</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --titlebar-height: 38px;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        height: 100vh;
        overflow: hidden;
      }

      #root {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
